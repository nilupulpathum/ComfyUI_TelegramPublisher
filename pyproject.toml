[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ComfyUI-TelegramPublisher"
version = "0.1.0"
description = "Publish ComfyUI generations to Telegram securely and reliably."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["comfyui", "telegram", "image-publishing"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
# Runtime deps stay minimal per ADR-001 / AI coding guide dependency policy.
# Pillow: needed for IMAGE tensor -> PNG/JPEG encoding (T008).
# numpy: array conversion inside the encoder (T008); always present wherever
# ComfyUI runs (torch dependency), declared here so installs stay honest.
dependencies = [
  "Pillow>=10",
  "numpy>=1.26",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  # numpy: build fake IMAGE tensors in tests without starting ComfyUI.
  "numpy>=1.26",
]

[tool.setuptools.packages.find]
include = ["publisher_nodes*", "telegram*", "services*", "storage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
